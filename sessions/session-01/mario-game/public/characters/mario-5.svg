<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hat top (tall narrow — Waluigi) -->
  <rect x="18" y="2" width="28" height="20" rx="5" fill="#800080"/>
  <!-- Hat brim -->
  <rect x="8" y="18" width="48" height="8" rx="2" fill="#800080"/>
  <!-- Face (narrow, angular) -->
  <ellipse cx="32" cy="46" rx="15" ry="18" fill="#FDBCB4"/>
  <!-- Eyes (narrowed) -->
  <ellipse cx="25" cy="41" rx="3.5" ry="2.5" fill="#1a1a1a"/>
  <ellipse cx="39" cy="41" rx="3.5" ry="2.5" fill="#1a1a1a"/>
  <circle cx="26" cy="40.5" r="1" fill="white"/>
  <circle cx="40" cy="40.5" r="1" fill="white"/>
  <!-- Nose (pointed) -->
  <ellipse cx="32" cy="47" rx="4" ry="3.5" fill="#E08C6C"/>
  <!-- Mustache (thin, curly — Waluigi) -->
  <path d="M 20 53 Q 26 58 32 53 Q 38 48 44 53" stroke="#4A2010" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
